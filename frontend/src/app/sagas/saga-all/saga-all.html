<app-page-header backgroundImg="vignette.jpg">
  <i>Riddarasögur</i>
</app-page-header>

<div class="card-body page-container">
  <div class="container">
    @if (initialising) {
      <div class="spinner-border spinner-border-lg" role="status"> </div>
    } @else {
      @for (saga of sagas; track saga.id) {
        @if ($loggedIn() || saga.published) {
          <div class="row">
            <div class="col-auto ms-3">
              <h4>
                <i>
                  <a [routerLink]="['/sagas', saga.id]">{{ saga.title }}</a>
                </i>
              </h4>
            </div>
          </div>
        }
      }
    }

    @if ($loggedIn()) {
      <div class="row mt-3">
        <div class="col-sm ms-3">
          <button
            (click)="addSaga()"
            data-testid="add-button"
            type="button"
            class="btn btn-success btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#editAddSaga">
            Add
          </button>
        </div>
      </div>
    }
  </div>
</div>
