spring:
  datasource:
    username: tg
    password: admin
    url: jdbc:postgresql://localhost:5432/riddaradb-postgres
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: false
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: create
              create-source: metadata
              create-target: schema-for-drawio.sql
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  admin:
    username: admin
    password: password
  site-locked: false
  motifs:
    max-search-results: 200
    import-motifs-on-startup: true

server:
  servlet:
    session:
      timeout: 14d
      cookie:
        max-age: 14d

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.schema: DEBUG

#Generate SQL files
