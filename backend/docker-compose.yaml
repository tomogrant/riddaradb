services:
  postgres:
    image: postgres:17
    container_name: riddaradb-postgres

    environment:
      POSTGRES_DB: riddaradb-postgres
      POSTGRES_USER: tg
      POSTGRES_PASSWORD: admin

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: