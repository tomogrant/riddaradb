spring:
  datasource:
    username: tg
    password: admin
    url: jdbc:postgresql://localhost:5432/riddaradb-postgres
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  admin:
    username: admin
    password: password
  site-locked: false
  motifs:
    max-search-results: 200

server:
  servlet:
    session:
      timeout: 14d
      cookie:
        max-age: 14d

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.schema: DEBUG
